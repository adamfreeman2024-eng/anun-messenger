name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: system opus
        run: sudo apt-get update && sudo apt-get install -y libopus0
      - name: install
        run: python -m pip install -r requirements.txt
      - name: test
        run: python -m unittest spike.test_spike spike.test_phase3 spike.test_continue spike.test_product spike.test_reply spike.test_file_parts spike.test_disappear spike.test_opus spike.test_call_run spike.test_local
